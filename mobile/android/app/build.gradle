apply plugin: 'com.android.application'

android {
    namespace = "com.kb.kbplatform"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kb.kbplatform"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 16
        versionName "1.15"
        // 更新包/热更包允许的下载域名白名单（逗号分隔）。
        // 原生 ApkInstallerPlugin 用它做第二道防线：即使 WebView 内 JS 被注入，
        // 直接调用桥也无法把 APK 下载地址指到第三方域名（外部审查 2026-10-11）。
        // 打包时传：./gradlew assembleRelease -PKB_ALLOWED_HOSTS=www.example.com
        // 不传则原生拒绝一切应用内更新（fail-closed），只能走浏览器外部下载。
        resValue "string", "kb_allowed_hosts", (project.findProperty("KB_ALLOWED_HOSTS") ?: "")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def ksPath = System.getenv('KB_KS_PATH') ?: file('../keystore/kb-release.jks').absolutePath
    // 口令只从环境变量 / 用户级 gradle.properties（KB_KS_PASS）读取，仓库里不留默认口令
    def ksPass = System.getenv('KB_KS_PASS') ?: (project.findProperty('KB_KS_PASS') ?: '')
    signingConfigs {
        release {
            // 签名密钥：mobile/android/keystore/kb-release.jks（已被 .gitignore 排除，绝不入库）
            storeFile file(ksPath)
            storePassword ksPass
            keyAlias System.getenv('KB_KS_ALIAS') ?: 'kb'
            keyPassword ksPass
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 缺密钥/口令时正式包必须失败，防止静默产出 debug 签名的「正式包」（2026-10-06 外部安全审查）。
            // 但**不能在配置阶段 throw**：buildTypes 闭包在配置期执行，任何 build/sync 都会连带失败
            // （外部复审指出「会误伤所有构建」——IDE 同步、assembleDebug、clean 全挂）。
            // 正确做法：配置期只决定用哪个签名（优雅回退），把「缺密钥」的硬失败挂到
            // release 打包任务执行前（doFirst），只有真的要出 release 包时才报错。
            def ksOk = file(ksPath).exists() && ksPass
            signingConfig(ksOk ? signingConfigs.release : signingConfigs.debug)
            tasks.matching { it.name.toLowerCase().contains('release') }
                 .configureEach {
                     doFirst {
                         if (!ksOk && System.getenv('KB_ALLOW_UNSIGNED_RELEASE') != '1') {
                             throw new GradleException('release 构建缺少签名密钥（keystore 或 KB_KS_PASS）；' +
                                 '本地联调可设 KB_ALLOW_UNSIGNED_RELEASE=1 回退 debug 签名')
                         }
                     }
                 }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Capacitor 模块仅在实际同步（capSynced，见 settings.gradle）后参与构建；
    // 未同步的 clone 跳过，避免 IDE 打开即报生成物缺失
    if (gradle.ext.capSynced) {
        implementation project(':capacitor-android')
        implementation project(':capacitor-cordova-android-plugins')
    }
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

if (gradle.ext.capSynced) {
    def capBuildFile = file('capacitor.build.gradle')
    if (capBuildFile.exists()) { apply from: capBuildFile }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
