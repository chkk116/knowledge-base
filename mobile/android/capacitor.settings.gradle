// DO NOT EDIT THIS FILE! IT IS GENERATED EACH TIME "capacitor update" IS RUN
include ':capacitor-android'
project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
// Capgo 前端热更插件（@capgo/capacitor-updater）
// 注意：本文件与 app/capacitor.build.gradle 平时由 `npx cap sync` 生成，
// 但本项目 webDir(web-app) 是不完整的旧目录，跑 cap sync 会把 assets/public 覆盖掉，
// 所以这里手工登记插件，不要跑 cap sync。
include ':capgo-capacitor-updater'
project(':capgo-capacitor-updater').projectDir = new File('../node_modules/@capgo/capacitor-updater/android')
// @capacitor/app（返回键监听 / getInfo 读版本号）—— 同样手工登记，勿跑 cap sync
include ':capacitor-app'
project(':capacitor-app').projectDir = new File('../node_modules/@capacitor/app/android')
// @capacitor/browser（用系统浏览器打开外链/APK 下载）—— 手工登记，勿跑 cap sync
include ':capacitor-browser'
project(':capacitor-browser').projectDir = new File('../node_modules/@capacitor/browser/android')

// @capacitor/share（导出/分享：写文件 + 拉起系统分享）—— 手工登记，勿跑 cap sync
include ':capacitor-share'
project(':capacitor-share').projectDir = new File('../node_modules/@capacitor/share/android')

// @capacitor/filesystem（导出/分享：写文件 + 拉起系统分享）—— 手工登记，勿跑 cap sync
