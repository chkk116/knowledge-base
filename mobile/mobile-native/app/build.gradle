plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.kb.kbplatform.shell'
    compileSdk 36

    defaultConfig {
        // P4 转正：与 Capacitor 版同 id，直接覆盖安装升级（须用同一签名 kb-release.jks，
        // debug 签名不同会安装失败——先卸载旧版或用 release 签名出包）
        applicationId 'com.kb.kbplatform'
        minSdk 24
        targetSdk 36
        // ⚠️ 必须大于线上 Capacitor 版的 versionCode（当前 29），否则：
        //   1) 覆盖安装直接失败（INSTALL_FAILED_VERSION_DOWNGRADE）；
        //   2) AppUpdater 会认为线上 29 更新，把 Capacitor 包又装回来（版本回环）。
        // 与 Web/Capacitor 版对齐成同一套版本号：原生壳原来用 0.9.11-native(50)，
        // 服务端只认 Capacitor 的 code（30），于是「50 > 30」被判定为已是最新，永远收不到更新。
        // 10305 = 1.03.05 编码，高于历史所有 code（含老 0.9.x 的三位数）。
        versionCode 10309
        versionName '1.3.9'

        // 只打真机 ABI：ML Kit 的 OCR 原生库单个 6~11MB，四套全打会有 39MB，
        // 其中 x86/x86_64 只有模拟器用得到（纯浪费 22MB）。arm64 覆盖现在的手机，
        // armeabi-v7a 兜住老的 32 位机。副作用：x86 模拟器装不上（真机不受影响）。
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // 应用内更新允许的下载域名（逗号分隔），与后端同源域名始终放行。
        // 出包时可用 -PKB_ALLOWED_HOSTS=xxx 追加，防止版本接口被篡改后装任意 APK。
        buildConfigField "String", "KB_ALLOWED_HOSTS", "\"${project.findProperty('KB_ALLOWED_HOSTS') ?: ''}\""

        // 出厂默认后端地址：出正式包时 -PKB_BASE_URL=https://www.你的域名 注入，
        // 仓库里仍不存公网地址；不传则回落模拟器地址 http://10.0.2.2:8080（本地调试用）。
        buildConfigField "String", "KB_BASE_URL", "\"${project.findProperty('KB_BASE_URL') ?: ''}\""
    }

    // 签名：复用 Capacitor 版的同一把密钥，否则无法覆盖安装（applicationId 相同、签名不同会装不上）。
    // 口令只从环境变量 / 用户级 gradle.properties（KB_KS_PASS）读取，仓库不留口令。
    def ksCandidates = [
            System.getenv('KB_KS_PATH'),
            // 仓库内布局：knowledge-base/mobile/mobile-native/app → ../../android/keystore
            '../../android/keystore/kb-release.jks',
            // 旧布局兜底（工程放在别处、或平级 android/ 目录）
            '../android/keystore/kb-release.jks',
            '../../../../知识库/knowledge-base/mobile/android/keystore/kb-release.jks',
    ].findAll { it != null }
    def ksFile = ksCandidates.collect { file(it) }.find { it.exists() }
    def ksPass = System.getenv('KB_KS_PASS') ?: (project.findProperty('KB_KS_PASS') ?: '')
    def canSignRelease = ksFile != null && ksPass
    if (!canSignRelease) {
        logger.lifecycle("[kb-native] 未找到签名密钥或口令（KB_KS_PASS）→ release 包将不带签名；debug 构建不受影响")
    }
    signingConfigs {
        release {
            if (ksFile != null) storeFile ksFile
            storePassword ksPass
            keyAlias System.getenv('KB_KS_ALIAS') ?: 'kb'
            keyPassword ksPass
        }
    }

    buildTypes {
        release {
            // 无密钥时不挂 signingConfig，避免配置阶段抛错把 assembleDebug / IDE 同步一起搞挂
            if (canSignRelease) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        // KB_ALLOWED_HOSTS 走 BuildConfig 注入（见 defaultConfig）
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    // 完整 Material 图标集：套壳用的是 Element Plus 线性图标，原生侧用 emoji 观感差太远。
    // release 开着 minify，R8 只会保留实际用到的图标，包体影响可忽略。
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.navigation:navigation-compose:2.8.4'

    implementation 'androidx.webkit:webkit:1.12.1'

    // 图片加载（第三方登录头像、文档封面等）。选 Coil 而不是 Glide：纯 Compose API、体积小，
    // 自带内存 + 磁盘缓存，圆角/圆形裁剪交给 Modifier 即可。
    implementation 'io.coil-kt:coil-compose:2.7.0'
    // SVG 头像（dicebear 等）必须靠这个解码器，否则 Coil 直接报错、界面留空圈
    implementation 'io.coil-kt:coil-svg:2.7.0'

    // 本地 OCR（对标套壳 Tesseract.js：离线、不传图）——ML Kit 中文识别（打包模型，无 Play 服务依赖）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'

    // 原生富文本编辑器（GitHub 活跃维护：MohamedRejeb/compose-rich-editor，HTML/Markdown）
    implementation 'com.mohamedrejeb.richeditor:richeditor-compose:1.0.0-rc08'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
}
