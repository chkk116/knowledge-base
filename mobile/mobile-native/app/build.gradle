plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.kb.kbplatform.shell'
    compileSdk 36

    defaultConfig {
        // 独立 applicationId：与 Capacitor 版（com.kb.kbplatform）可并存安装、真机对照体验。
        // 转正替换旧 App 时改回 com.kb.kbplatform 即可。
        applicationId 'com.kb.kbplatform.shell'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '0.1.1-native'

        // 生产默认后端地址：出正式包时用 -PKB_BASE_URL=https://www.你的域名 注入，
        // 仓库里不留任何公网地址（与 Web 端 VITE_NATIVE_ORIGIN 同一思路）。
        // 不传则留空串，由 AppConfig 回落到模拟器地址 http://10.0.2.2:8080。
        buildConfigField "String", "KB_DEFAULT_BASE_URL", "\"${project.findProperty('KB_BASE_URL') ?: ''}\""
    }

    // 签名：复用 Capacitor 版同一把密钥（mobile/android/keystore/kb-release.jks），
    // 这样原生壳转正后能覆盖安装、用户不用卸载重装。
    // 口令只从环境变量 / 用户级 ~/.gradle/gradle.properties（KB_KS_PASS）读取，仓库不留口令。
    def ksFile = file(System.getenv('KB_KS_PATH') ?: '../../android/keystore/kb-release.jks')
    def ksPass = System.getenv('KB_KS_PASS') ?: (project.findProperty('KB_KS_PASS') ?: '')
    def canSignRelease = ksFile.exists() && ksPass
    if (!canSignRelease) {
        logger.lifecycle("[kb-native] 未找到签名密钥或口令（KB_KS_PASS），release 包将不带签名；debug 构建不受影响")
    }
    signingConfigs {
        release {
            storeFile ksFile
            storePassword ksPass
            keyAlias System.getenv('KB_KS_ALIAS') ?: 'kb'
            keyPassword ksPass
        }
    }

    buildTypes {
        release {
            // 无密钥时不挂 signingConfig，避免配置阶段直接抛错把 assembleDebug / IDE 同步一起搞挂
            if (canSignRelease) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        // KB_DEFAULT_BASE_URL 走 BuildConfig 注入（见 defaultConfig）
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.navigation:navigation-compose:2.8.4'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
