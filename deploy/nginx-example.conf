# ============================================================
# 知识库 KB — 生产/测试 双环境 Nginx 模板（域名驱动，配置里不含任何公网 IP）
# 部署机：腾讯云 YOUR_SERVER_IP（公网 IP 只在 DNS 解析里出现，本文件全用 127.0.0.1）
#
# 前置：
#   1) DNS：www.example.com 与 test.example.com 都 A 记录到 YOUR_SERVER_IP
#   2) 证书：腾讯云控制台或 certbot 签发 example.com 通配符/单域名证书，路径见下
#   3) 前端构建：npm run build:prod -> dist-prod ; npm run build:test -> dist-test
#   4) 后端：SPRING_PROFILES_ACTIVE=prod 跑 8080 / 1234；=test 跑 8081 / 1235
#
# 这样「打包/部署」只在构建时选 mode，和切换 SPRING_PROFILES_ACTIVE，全程不碰 IP。
# ============================================================

# ---------- 生产：www.example.com ----------
server {
    client_max_body_size 64m;   # 上传/多模态图片体积需要（50MB 上限），默认 1MB 会全部 413
    listen 80;
    server_name www.example.com;
    return 301 https://$host$request_uri;
}

server {
    client_max_body_size 64m;   # 上传/多模态图片体积需要（50MB 上限），默认 1MB 会全部 413
    listen 443 ssl;
    server_name www.example.com;
    ssl_certificate     /etc/nginx/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com/privkey.pem;

    # 前端静态资源（构建产物 dist-prod）
    root /var/www/kb/dist-prod;
    index index.html;

    # SPA _history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（Spring Boot :8080）
    location /api/ {
        # 注意：proxy_pass 末尾**不能带斜杠**。带 `/` 时 nginx 会把匹配到的 location 前缀
        # （即 /api/）替换成 `/`，/api/docs 会被转发成 /docs → 后端全部 404
        # （后端接口都挂在 /api/ 下且没有配 context-path）。不带斜杠才会原样透传 URI。
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件
    # ⚠️ 必须用 `^~` 前缀匹配：站点里还有 `location ~* \.(jpg|png|...)$` 这类正则 location，
    # 正则优先级高于普通前缀，会把 /uploads/*.jpg 当静态文件去站点目录找 → 404
    # （2026-10-06 灯箱「只出遮罩没图」、视频被当 HTML 返回的真凶）。
    # proxy_pass 也不要带 URI，原样透传 /uploads/...
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # 协同 WebSocket 中继（Hocuspocus :1234）-> wss://www.example.com/collab/
    location /collab/ {
        proxy_pass http://127.0.0.1:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

# ---------- 测试：test.example.com ----------
server {
    client_max_body_size 64m;   # 上传/多模态图片体积需要（50MB 上限），默认 1MB 会全部 413
    listen 80;
    server_name test.example.com;
    return 301 https://$host$request_uri;
}

server {
    client_max_body_size 64m;   # 上传/多模态图片体积需要（50MB 上限），默认 1MB 会全部 413
    listen 443 ssl;
    server_name test.example.com;
    ssl_certificate     /etc/nginx/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com/privkey.pem;

    root /var/www/kb/dist-test;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 同生产：末尾不能带斜杠，否则 /api 前缀会被剥掉（详见上方生产段注释）
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 同上：必须 ^~ ，否则被正则 location 抢走
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8081;
    }

    # 协同 WebSocket 中继（Hocuspocus :1235）-> wss://test.example.com/collab/
    location /collab/ {
        proxy_pass http://127.0.0.1:1235/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
