# 可选基础设施：本地 MySQL 模式下默认不需要 Docker。
# 仅在你想启用检索增强（Meilisearch）或附件存储（MinIO）时，用下面命令按需启动：
#   docker compose --profile optional up -d meilisearch
#   docker compose --profile optional up -d minio
services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    profiles: ["optional"]
    environment:
      # master key 同时充当 API key；后端 kb.search.meili.api-key 填同一个值。生产务必改成强随机串！
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
      MEILI_ENV: development          # 内网用 development（不强制 HTTPS）；生产建议 production + TLS
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data        # 持久化索引，否则容器重启后索引清空需重新灌库
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    profiles: ["optional"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-kb-redis-dev-pass}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: ["optional"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # 模型服务（RAG 预留，可选）：
  #   docker compose --profile ai up -d ollama
  ollama:
    image: ollama/ollama:latest
    profiles:
      - ai
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  miniodata:
  ollamadata:
  redis_data:
  meili_data:
