<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 移动端专用视口：禁止缩放（App 内不需要双指缩放页面），适配刘海屏 safe-area -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f1e" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="知识库" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png?v=3" />
  <title>知识库</title>
  <link rel="stylesheet" href="/boot-loading.css" />
</head>
<body class="kb-mobile-body">
  <div id="app"></div>
  <!-- 首屏占位：路由守卫核验登录态 + 首屏 chunk 下载期间原本是纯白屏（邀请页/慢网最明显）。
       纯 HTML/CSS + 一段 15 秒超时兜底（入口脚本没加载出来时至少给个刷新入口）。 -->
  <div id="boot-loading" role="status" aria-live="polite">
    <div class="boot-spinner"></div>
    <div class="boot-text">加载中…</div>
    <div class="boot-fail">加载时间有点久，可能是网络不稳。<br /><a href="#">点此刷新</a></div>
  </div>
  <!-- 兜底逻辑走外部文件：CSP script-src 不含 'unsafe-inline'，内联脚本会被拦掉 -->
  <script src="/boot-timeout.js"></script>
  <script type="module" src="/src/main-mobile.js"></script>
</body>
</html>
