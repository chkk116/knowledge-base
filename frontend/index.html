<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1e1b4b" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="format-detection" content="telephone=no" />

  <!-- PWA manifest + 图标 -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- 浏览器 tab 用：32x32 静态 PNG 体积小、渲染稳定（替代原 logo.gif，避免 Chrome 标签页动图耗电与截帧异常） -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=3" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png?v=3" />
  <!-- iOS 兜底：apple-touch-icon 不支持 SVG/GIF，PNG 才能正确写入主屏 -->
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png?v=3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="知识库" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>知识库 · KB</title>
</head>
<body>
  <div id="app"></div>
  <!-- 首屏占位：路由守卫要先核验登录态、页面 chunk 也要下载，这段时间原来是纯白屏（邀请页/慢网尤其明显）。
       纯 HTML/CSS，不依赖任何 JS 与框架；main.js 挂载完成后自行移除。 -->
  <div id="boot-loading" role="status" aria-live="polite">
    <div class="boot-spinner"></div>
    <div class="boot-text">加载中…</div>
  </div>
  <style>
    #boot-loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
      align-items: center; justify-content: center; background: #f7f8fb; color: #6b7280;
      font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      z-index: 9999; }
    .boot-spinner { width: 26px; height: 26px; border-radius: 50%;
      border: 2.5px solid #e5e7eb; border-top-color: #6366f1; animation: boot-spin .9s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      #boot-loading { background: #14161f; color: #9aa3b2; }
      .boot-spinner { border-color: #2b2f3d; border-top-color: #818cf8; }
    }
  </style>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
