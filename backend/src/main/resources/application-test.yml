# ============================================================
# 测试环境配置（激活：SPRING_PROFILES_ACTIVE=test）
#
# 与生产同机不同端口 / 不同库 / 不同上传目录，来回切换不污染生产数据。
# 同 prod：所有可变项走环境变量，jar 与生产完全同一份。
#
# 端口约定（与 deploy/nginx-example.conf 保持一致）：
#   后端 8081 / 协同中继 1235
# ============================================================

server:
  port: ${KB_SERVER_PORT:8081}

spring:
  datasource:
    # 测试库 kb_test（独立，随便造数据）
    url: jdbc:mysql://${KB_DB_HOST:localhost}:${KB_DB_PORT:3306}/${KB_DB_NAME:kb_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${KB_DB_USER:kb}
    password: ${KB_DB_PASSWORD:kb}
  jpa:
    hibernate:
      ddl-auto: ${KB_DDL_AUTO:update}      # 测试库可自动建表，方便重置

kb:
  security:
    # 测试环境允许弱占位值兜底（便于本地起服务），但仍建议注入真实随机串
    token-secret: ${KB_TOKEN_SECRET:test-change-me-long-random-string}
  ai:
    zhipu:
      api-key: ${KB_ZHIPU_API_KEY:}
  cors:
    allowed-origins: ${KB_CORS_ORIGINS:}
    allow-credentials: ${KB_CORS_ALLOW_CREDENTIALS:false}
  collab:
    port: ${KB_COLLAB_PORT:1235}           # 测试协同中继端口（Nginx /collab/ 反代到此）
  upload:
    # 绝对路径，与生产的 /var/www/kb/uploads 隔离
    dir: ${KB_UPLOAD_DIR:/var/www/kb-test/uploads}
  seed:
    enabled: true                          # 测试自动灌示例数据，开箱即用
