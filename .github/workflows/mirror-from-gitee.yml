# 注意：本工作流每 6 小时把 Gitee master 强推到公开 GitHub master，
# 「只推 Gitee」不是隔离 —— 任何敏感信息 / 大二进制资产都不要进本仓库。
name: Mirror from Gitee
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync master and tags from Gitee
        run: |
          set -e
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git remote add gitee https://gitee.com/chkk116/knowledge-base.git
          # --force：允许覆盖本地同名 tag（重写历史后 tag 指向会变）
          git fetch gitee --prune --force --tags
          git push origin refs/remotes/gitee/master:refs/heads/master --force
          git push origin --tags --force
