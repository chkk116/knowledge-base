<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231677ff'/><path d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>" />
  <title>kb-ocr-web · 离线中文 OCR 演示</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6f7; color: #1d2129; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .sub { color: #86909c; font-size: 13px; margin: 0 0 22px; }
    .card { background: #fff; border: 1px solid #e5e6eb; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    label.btn { display: inline-flex; align-items: center; gap: 6px; background: #1677ff; color: #fff;
      padding: 9px 16px; border-radius: 7px; cursor: pointer; font-size: 14px; }
    label.btn input { display: none; }
    button { background: #f2f3f5; border: 1px solid #e5e6eb; color: #1d2129; padding: 9px 16px;
      border-radius: 7px; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    select { padding: 8px 10px; border: 1px solid #e5e6eb; border-radius: 7px; font-size: 14px; background: #fff; }
    .hint { font-size: 12px; color: #86909c; }
    .bar { height: 6px; background: #f2f3f5; border-radius: 4px; overflow: hidden; margin-top: 14px; display: none; }
    .bar > i { display: block; height: 100%; width: 0; background: #1677ff; transition: width .2s; }
    #status { font-size: 13px; color: #4e5969; margin-top: 10px; min-height: 18px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
    .imgbox { position: relative; background: #fafafa; border: 1px dashed #e5e6eb; border-radius: 8px;
      min-height: 200px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #stage { position: relative; display: none; line-height: 0; max-width: 100%; }
    #preview { max-width: 100%; height: auto; display: block; }
    #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
    .placeholder { color: #c9cdd4; font-size: 13px; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 14px; line-height: 1.8;
      background: #fafafa; border: 1px solid #f2f3f5; border-radius: 8px; padding: 14px; min-height: 160px; margin: 0; }
    .meta { display: flex; gap: 18px; margin-top: 12px; font-size: 13px; color: #4e5969; flex-wrap: wrap; }
    .meta b { color: #1d2129; }
    .err { color: #f53f3f; }
    code { background: #f2f3f5; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>kb-ocr-web · 离线中文 OCR</h1>
    <p class="sub">RapidOCR PP-OCRv3 ONNX 模型 + ONNX Runtime Web（WASM）。与 Python / Android / iOS 共用同一套 API 契约，全部在本地推理、无需联网。</p>

    <div class="card">
      <div class="row">
        <label class="btn">选择图片<input id="file" type="file" accept="image/*" /></label>
        <button id="run" disabled>开始识别</button>
        <button id="sample">用内置示例</button>
        <select id="mode">
          <option value="full">运行时全开（版面重排 + 数字后处理）</option>
          <option value="bare">裸识别（不重排 / 不后处理）</option>
        </select>
      </div>
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <div id="status">正在加载模型…</div>
      <p class="hint">首次加载会下载 det / rec / cls 三个 ONNX 模型（约 14MB）与 WASM 运行时；之后可接入 IndexedDB 缓存实现完全离线。</p>
    </div>

    <div class="cols">
      <div class="card">
        <div class="imgbox" id="imgbox">
          <span class="placeholder" id="ph">尚未选择图片</span>
          <div id="stage">
            <img id="preview" />
            <canvas id="overlay"></canvas>
          </div>
        </div>
      </div>
      <div class="card">
        <pre id="out"></pre>
        <div class="meta">
          <span>行数 <b id="mLines">—</b></span>
          <span>耗时 <b id="mMs">—</b></span>
          <span>引擎 <b id="mEngine">—</b></span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/demo/main.ts"></script>
</body>
</html>
