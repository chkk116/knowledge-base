[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-ocr-runtime"
version = "0.1.0"
description = "Unified offline OCR runtime: one API, one ONNX model set, across Android/iOS/desktop/Web/backend."
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = ["numpy", "pillow", "rapidocr-onnxruntime"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ocr_runtime*"]
